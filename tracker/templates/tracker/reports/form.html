{% extends 'tracker/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="ph"><div><h1><i class="fas fa-chart-bar me-2 text-primary"></i>{{ title }}</h1></div><a href="{% url 'report_list' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a></div>
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}
<div class="row g-3">
  <div class="col-12"><label class="form-label">Report Name *</label>{{ form.name }}</div>
  <div class="col-md-6"><label class="form-label">Report Type *</label>{{ form.report_type }}</div>
  <div class="col-md-6"><label class="form-label">Vehicle (optional)</label>{{ form.vehicle }}</div>
  <div class="col-md-6"><label class="form-label">Start Date *</label>{{ form.start_date }}</div>
  <div class="col-md-6"><label class="form-label">End Date *</label>{{ form.end_date }}</div>
  <div class="col-12"><button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-file-alt me-2"></i>Generate Report</button></div>
</div>
</form>
</div></div>
{% endblock %}
